name: auto sign

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install node-fetch@2

      - run: node sign.js
        env:
          COOKIE: ${{ secrets.COOKIE }}
